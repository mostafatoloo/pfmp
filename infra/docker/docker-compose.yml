# Local / CI stack — SQL Server required for Phase 1 (no PostgreSQL)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pfmp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Your_strong_Password123}"
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Optional stubs — uncomment when running full stack
  # web:
  #   build:
  #     context: ../..
  #     dockerfile: infra/docker/Dockerfile.web
  #   ports:
  #     - "3000:3000"
