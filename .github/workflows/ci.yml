name: CI

on:
  push:
    branches: [main, "cursor/**", "feat/**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from package.json "packageManager" (do not also set version here)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm db:generate
      - run: pnpm test:unit

  integration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_strong_Password123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_Password123 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 40s
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=pfmp;user=sa;password=Your_strong_Password123;encrypt=true;trustServerCertificate=true"
      TEST_DATABASE_URL: "sqlserver://localhost:1433;database=pfmp_test;user=sa;password=Your_strong_Password123;encrypt=true;trustServerCertificate=true"
      BETTER_AUTH_SECRET: "ci-test-secret-at-least-32-chars-long!!"
      BETTER_AUTH_URL: "http://localhost:3000"
      APP_URL: "http://localhost:3000"
      MSSQL_SA_PASSWORD: Your_strong_Password123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm db:ensure
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: Migrate test database
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm db:migrate
      - run: pnpm test:integration
